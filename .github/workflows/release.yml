name: Release

# Triggered by a semver tag push (git tag v1.0.0 && git push --tags)
# or manually via Actions UI with a tag_name input.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate binary Android files (gradle wrapper jar + icons)
        run: flutter create --platforms=android --no-pub .

      - name: Restore committed Android config (AGP 8.1, Kotlin 1.9.22, compileSdk 34)
        run: git checkout HEAD -- android/

      - name: Remove boilerplate test generated by flutter create
        run: rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Run tests (non-blocking)
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
