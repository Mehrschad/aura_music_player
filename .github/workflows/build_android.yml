name: Build Android
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate binary Android files (gradle wrapper jar + icons)
        run: flutter create --platforms=android --no-pub .

      - name: Restore committed Android config (package io.mehrschad.aura, compileSdk 35)
        run: git checkout HEAD -- android/

      - name: Remove stale kotlin sources left by flutter create
        # flutter create places MainActivity.kt at com/example/<name>/.
        # Our package is io/mehrschad/aura/ so we remove the stale path to
        # avoid a duplicate-class Kotlin compilation error.
        run: rm -rf android/app/src/main/kotlin/com/

      - name: Remove boilerplate test generated by flutter create
        run: rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Run tests (non-blocking)
        run: flutter test
        continue-on-error: true

      - run: flutter build apk --release

      # Always upload the APK as a workflow artifact (downloadable from Actions tab)
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # On tag pushes (e.g. v1.0.0), also build AAB and publish a GitHub Release
      - name: Build release App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
