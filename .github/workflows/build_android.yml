name: Build Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --no-pub .

      - name: Remove boilerplate test (references MyApp which does not exist)
        run: rm -f test/widget_test.dart

      - name: Patch Kotlin version (flutter create generates 1.7.1 but packages need 1.9.x)
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          grep 'kotlin' android/settings.gradle

      - run: flutter pub get

      - run: flutter gen-l10n

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Run tests (non-blocking)
        run: flutter test
        continue-on-error: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
